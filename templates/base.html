{% load static %}
<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap"
              rel="stylesheet" />
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet" />
        <link href="{% static 'css/style.css' %}" rel="stylesheet" />
        <title>{% block title %}Default{% endblock %} · Dance School</title>
    </head>
    <body class="d-flex flex-column min-vh-100">
        <nav class="navbar navbar-expand-lg navbar-dark site-nav sticky-top">
            <div class="container">
                <a class="navbar-brand d-flex align-items-center"
                   href="{% url 'home' %}"
                   title="Vai a Homepage">
                    <img src="{% static 'img/logo.png' %}" alt="Logo della Scuola">
                    Dance School
                </a>
                <button class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#mainNav"
                        aria-controls="mainNav"
                        aria-expanded="false"
                        aria-label="Apri il menu">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto align-items-lg-center">
                        <li class="nav-item">
                            <a class="nav-link {% if request.path == '/about/' %}active{% endif %}"
                               href="{% url 'about' %}"
                               title="Vai a Chi siamo">Chi siamo</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if request.path|slice:':8' == '/school/' %}active{% endif %}"
                               href="{% url 'lista_scuole' %}"
                               title="Vai a Lista delle Scuole">Scuole</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/school-conf/corsi/' in request.path %}active{% endif %}"
                               href="{% url 'course_list' %}"
                               title="Vai a Lista dei Corsi">Corsi</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/school-conf/classi/' in request.path %}active{% endif %}"
                               href="{% url 'classroom_list' %}"
                               title="Vai a Lista delle Classi">Classi</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link {% if '/school-conf/giorni/' in request.path %}active{% endif %}"
                               href="{% url 'dayoftheweek_list' %}"
                               title="Vai a Lista dei Giorni">Giorni</a>
                        </li>
                        <li class="nav-item ms-lg-2">
                            <a class="btn btn-sm btn-light"
                               href="{% url 'admin:login' %}"
                               title="Vai al Pannello di Amministrazione">Admin</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        <main class="container">
            {% block content %}{% endblock %}
        </main>
        <footer class="site-footer">
            <div class="container d-flex flex-column flex-md-row justify-content-between">
                <address>Via dello Sport 42, Modena, 41124</address>
                <p>Phone: 059 424242</p>
                <p>
                    Email: <a href="mailto:email@dance-school.it">email@dance-school.it</a>
                </p>
            </div>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
