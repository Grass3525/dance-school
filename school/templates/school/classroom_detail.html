{% extends "base_detail.html" %}
{% block detail-content %}
    <dl class="row mb-4">
        <dt class="col-sm-3">Id</dt>
        <dd class="col-sm-9">{{ object.id }}</dd>
        <dt class="col-sm-3">Nome</dt>
        <dd class="col-sm-9">{{ object.name }}</dd>
        <dt class="col-sm-3">Capienza</dt>
        <dd class="col-sm-9">{{ object.capacity }} posti</dd>
    </dl>
    <a class="btn btn-outline-brand" href="{% url 'classroom_list' %}">&larr; Torna alla lista</a>
{% endblock %}
